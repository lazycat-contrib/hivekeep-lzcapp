version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: hivekeep

build:
  run_buildscript: false

images:
  - id: hivekeep
    target: service
    service: hivekeep
    source: ghcr.io/marlburrow/hivekeep
    channel: stable
    sort: semver
    tag_regex: '^v?[0-9]+\.[0-9]+\.[0-9]+$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Hivekeep
    summary: 自托管的自主、持久化个人 AI 智能体平台
